# Deploy config for banyantreetitle.com. Base directory in Netlify: banyan-tree-site
[build]
  command = "node build.mjs"
  publish = "dist"

# build.mjs refuses to build for the real domain while any required fact in
# site.json is still null. On the netlify.app address it builds a marked preview.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
